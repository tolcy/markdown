[package]
name = "tolcy"
version = "0.1.0"
description = "Tolcy — 本地 Markdown 编辑器"
authors = ["tolcy"]
license = "MIT"
repository = "https://gitee.com/tolcy/Tolcy"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
rfd = "0.15"
encoding_rs = "0.8"
open = "5"
url = "2"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = "0.5.3"
base64 = "0.22"
zeroize = "1"
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Security_Cryptography"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
